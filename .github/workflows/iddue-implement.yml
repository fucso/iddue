name: iddue implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'ready to implementation'
    runs-on: ubuntu-latest
    concurrency:
      group: iddue-implement-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.IDDUE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run implementation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.IDDUE_TOKEN }}
        run: |
          claude -p "/iddue:start ${{ github.event.issue.number }}"
