name: iddue - Address Review
on:
  pull_request_review:
    types: [submitted]
jobs:
  address:
    if: |
      startsWith(github.event.pull_request.head.ref, 'iddue/') &&
      contains(github.event.review.body, '<!-- iddue:pr:review -->') &&
      !contains(github.event.pull_request.labels.*.name, 'iddue: review ok')
    runs-on: ubuntu-latest
    concurrency:
      group: iddue-address-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Extract issue number
        id: issue
        run: echo "number=$(echo '${{ github.event.pull_request.head.ref }}' | sed 's|iddue/||')" >> $GITHUB_OUTPUT
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "/iddue:pr:address-review-feedback ${{ steps.issue.outputs.number }}"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
