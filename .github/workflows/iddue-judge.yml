name: iddue judge

on:
  issues:
    types: [labeled]

jobs:
  judge:
    if: github.event.label.name == 'iddue'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run judging
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.IDDUE_TOKEN }}
        run: |
          claude -p "/iddue:judging-ready-to-implementation ${{ github.event.issue.number }}"
