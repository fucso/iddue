# iddue:update-issue オーダーシート スキーマ定義
#
# iddue:open:* スキルが作成し .iddue/orders/{YYYYMMDD-HHMMSS}-update.yaml に保存する。
# iddue:update-issue スキルがこのファイルを読み込み、Issue を更新する。
# 更新完了後、このファイルは自動的に削除される。
#
# ⚠️ 記載原則:
#   各フィールドにはできるだけ詳細に情報を記載する。
#   iddue:update-issue はここに書かれた内容を材料に Issue 本文を組み立てるため、
#   省略・要約すると Issue の情報が薄くなる。収集したすべての情報を記録すること。

type: update

issue_number: 0  # 更新対象の Issue 番号

labels:  # 任意。ラベルの追加・削除がある場合のみ記述
  add:
    - "label-to-add"
  remove:
    - "ready to implementation"

objectives:  # 変更内容。複数指定可
  - what: |
      # 何を変更するか（複数行可）
    why: |
      # なぜ変更するか（複数行可）
    how: |
      # どのように変更するか（複数行可）
      # 空の場合は省略可

    detail:  # 任意。変更に伴う実装詳細
      # type: design — 具体的な実装変更
      - type: design
        target: "app/path/to/file.rb"
        change: "変更内容の説明"

      # type: spec — 要件・実現内容の変更
      - type: spec
        content: "変更後の要件・実現内容"
